services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./config:/config
      - ./data:/data
    environment:
      SCORING_CONFIG_PATH: /config/scoring/v2.yaml
      DATA_ROOT: /data
      CORS_ORIGINS: http://localhost:5173
      UV_LINK_MODE: copy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_API_MODE: live
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
