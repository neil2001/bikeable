[project]
name = "bikeable-backend"
version = "0.1.0"
description = "Bikeable route finder API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "networkx>=3.6.1",
    "osmnx>=2.1.1",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
src = ["app", "tests", "../scripts"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
